name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: juanderquest_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run unit & integration test suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/juanderquest_ci_test
          JWT_SECRET: test-super-secret-jwt-key-for-ci-only
          VALHALLA_URL: http://localhost:8002
          ALLOW_IN_MEMORY_FALLBACK: 'false'
        run: npm test

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Real PostgreSQL backup and restore drill
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/juanderquest_ci_test
        run: |
          set -euo pipefail
          # 1. Apply all migrations and seed representative record in primary CI database
          node -e "
            const { Pool } = require('pg');
            const { applyMigrations } = require('./dist/db/pool.js');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              await applyMigrations(pool);
              await pool.query(\`
                INSERT INTO users (id, seed_id, display_name, email, handle, is_public, role, demo_points, is_test)
                VALUES ('ci-u1', 'seed_ci_1', 'CI Traveler', 'ci@test.dev', 'ci_traveler', true, 'user', 500, false)
                ON CONFLICT (id) DO NOTHING;
              \`);
              await pool.end();
            })().catch(e => { console.error(e); process.exit(1); });
          "
          
          # 2. Dump schema and data to custom format archive
          pg_dump -Fc -d "$DATABASE_URL" -f /tmp/juanderquest_ci.dump
          
          # 3. Create fresh isolated drill database using separate commands (avoids transaction block error)
          PGPASSWORD=test_password psql -h localhost -U test_user -d postgres -c "DROP DATABASE IF EXISTS juanderquest_ci_drill;"
          PGPASSWORD=test_password psql -h localhost -U test_user -d postgres -c "CREATE DATABASE juanderquest_ci_drill;"
          
          # 4. Restore archive into drill database
          pg_restore --exit-on-error --single-transaction --clean --if-exists -d postgresql://test_user:test_password@localhost:5432/juanderquest_ci_drill /tmp/juanderquest_ci.dump
          
          # 5. Verify restored migration count and representative data completeness
          MIGRATION_COUNT=$(PGPASSWORD=test_password psql -h localhost -U test_user -d juanderquest_ci_drill -t -c "SELECT COUNT(*) FROM schema_migrations;")
          echo "Verified restored migration count: $MIGRATION_COUNT"
          test $(echo "$MIGRATION_COUNT" | tr -d '[:space:]') -ge 11

          USER_COUNT=$(PGPASSWORD=test_password psql -h localhost -U test_user -d juanderquest_ci_drill -t -c "SELECT COUNT(*) FROM users WHERE id = 'ci-u1';")
          echo "Verified restored user count: $USER_COUNT"
          test $(echo "$USER_COUNT" | tr -d '[:space:]') -eq 1
