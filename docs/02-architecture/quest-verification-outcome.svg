<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:sans-serif}
.box{fill:#fff;stroke:#333;stroke-width:1}
.th{font-size:14px;font-weight:600;fill:#222}
.ts{font-size:12px;fill:#555}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>

<rect class="box" x="210" y="40" width="260" height="56" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle">Backend verifies proof</text>
<text class="ts" x="340" y="82" text-anchor="middle">Signature, nonce, GPS confirmed</text>
<line x1="340" y1="96" x2="340" y2="140" stroke="#333" marker-end="url(#arrow)"/>

<rect class="box" x="210" y="140" width="260" height="44" rx="8"/>
<text class="th" x="340" y="164" text-anchor="middle">Proof valid?</text>

<path d="M275 184L185 230" stroke="#333" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="210">Valid</text>
<path d="M405 184L495 230" stroke="#333" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="210">Invalid</text>

<rect class="box" x="60" y="230" width="250" height="56" rx="8"/>
<text class="th" x="185" y="252" text-anchor="middle">Smart contract distributes</text>
<text class="ts" x="185" y="272" text-anchor="middle">JDQ tokens sent to user wallet</text>

<rect class="box" x="370" y="230" width="250" height="56" rx="8"/>
<text class="th" x="495" y="252" text-anchor="middle">Flagged for admin review</text>
<text class="ts" x="495" y="272" text-anchor="middle">Manual check in dashboard</text>
</svg>
