<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:sans-serif}
.box{fill:#fff;stroke:#333;stroke-width:1}
.th{font-size:14px;font-weight:600;fill:#222}
.ts{font-size:12px;fill:#555}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>

<rect class="box" x="210" y="40" width="260" height="56" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle">Quest completion attempt</text>
<text class="ts" x="340" y="82" text-anchor="middle">QR scan + AR interaction</text>
<line x1="340" y1="96" x2="340" y2="140" stroke="#333" marker-end="url(#arrow)"/>

<rect class="box" x="210" y="140" width="260" height="56" rx="8"/>
<text class="th" x="340" y="162" text-anchor="middle">Generate proof</text>
<text class="ts" x="340" y="182" text-anchor="middle">GPS + nonce + signature</text>
<line x1="340" y1="196" x2="340" y2="240" stroke="#333" marker-end="url(#arrow)"/>

<rect class="box" x="210" y="240" width="260" height="44" rx="8"/>
<text class="th" x="340" y="264" text-anchor="middle">Connected to network?</text>

<path d="M275 284L165 340" stroke="#333" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="185" y="310">No</text>
<path d="M405 284L515 340" stroke="#333" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="310">Yes</text>

<rect class="box" x="50" y="340" width="230" height="56" rx="8"/>
<text class="th" x="165" y="362" text-anchor="middle">Queue offline</text>
<text class="ts" x="165" y="382" text-anchor="middle">Saved encrypted, local sync queue</text>

<rect class="box" x="400" y="340" width="230" height="56" rx="8"/>
<text class="th" x="515" y="362" text-anchor="middle">Backend verifies proof</text>
<text class="ts" x="515" y="382" text-anchor="middle">Checks signature, nonce, GPS</text>

<line x1="165" y1="396" x2="165" y2="420" stroke="#333" marker-end="url(#arrow)"/>
<rect class="box" x="50" y="420" width="230" height="44" rx="8"/>
<text class="th" x="165" y="444" text-anchor="middle">Reconnects and syncs</text>

<path d="M280 442L515 442L515 396" stroke="#333" fill="none" marker-end="url(#arrow)"/>
</svg>
