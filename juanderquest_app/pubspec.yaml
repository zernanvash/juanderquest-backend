name: juanderquest_app
description: "JuanderQuest: A Gamified Blockchain-based System for Promoting Tourist Destinations in Pangasinan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  go_router: ^14.2.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  maplibre_gl: 0.26.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
