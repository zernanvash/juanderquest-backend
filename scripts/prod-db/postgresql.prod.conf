# JuanderQuest production PostgreSQL settings (Plan 116 §4.3).
# Sized for a container memory limit of 2 GB (bootstrap.sh --memory 2g) on SSD.
# If the limit changes, scale shared_buffers (25%) and effective_cache_size (60-75%).
# Mounted read-only at /etc/postgresql/jdq.conf and selected with -c config_file=.

listen_addresses = '*'            # inside the container; the host port is bound to 127.0.0.1 only
port = 5432
max_connections = 40              # backend pool max 5 per process + scripts + ops
password_encryption = scram-sha-256

# Memory
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 256MB      # index builds during national imports
huge_pages = off

# Planner (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off                         # short OLTP queries; JIT only adds latency

# WAL / checkpoints (disk-bounded laptop host)
wal_level = replica
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 256MB
# archive_mode needs a restart to change, so it is on from day one. Until the
# off-site target (Plan 116 D9) exists, the command discards segments; switching
# to wal-g later only needs a reload.
archive_mode = on
archive_command = '/bin/true'

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
log_min_duration_statement = 250ms
log_autovacuum_min_duration = 1s
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '

# Autovacuum (stats were stale on the old cluster; analyze sooner)
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# Safety nets (per-role timeouts are set in bootstrap.sh)
idle_in_transaction_session_timeout = 5min

# Locale / time
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'
